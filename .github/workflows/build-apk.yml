name: Build APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Ensure debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "debug.keystore verified successfully."

      - name: Prepare Release Signing Keystore
        id: prep_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
            echo "Release keystore prepared securely from GitHub Secrets."
          else
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
            echo "No release keystore secret configured in repository."
          fi

      - name: Build APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.prep_signing.outputs.has_release_keystore }}" == "true" ]; then
            echo "Building Production Release APK and Debug APK..."
            gradle assembleRelease assembleDebug --stacktrace --no-daemon
          else
            echo "Building Debug APK (Release build requires RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD secrets)..."
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release.keystore"

      - name: Prepare Release Assets
        id: prep_assets
        run: |
          TMP_DIR="/tmp/release_assets"
          mkdir -p "$TMP_DIR"
          
          # Copy APKs if found
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "$TMP_DIR/JaapCounter-release.apk"
            echo "Copied release APK"
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "$TMP_DIR/JaapCounter-debug.apk"
            echo "Copied debug APK"
          fi
          
          if [ ! "$(ls -A $TMP_DIR)" ]; then
            echo "Error: No APK files found in output directory!"
            exit 1
          fi

          echo "tmp_dir=$TMP_DIR" >> $GITHUB_OUTPUT

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jaap-counter-apks
          path: /tmp/release_assets/*.apk
          if-no-files-found: error

      - name: Publish APKs to GitHub Releases
        id: release_publishing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TMP_DIR="${{ steps.prep_assets.outputs.tmp_dir }}"
          
          if [ "${{ github.ref_type }}" == "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            TITLE="Release ${{ github.ref_name }}"
          else
            TAG_NAME="release-build-${{ github.run_number }}-${{ github.run_attempt }}"
            TITLE="Build #${{ github.run_number }} (${{ github.sha }})"
          fi
          
          NOTES="Automatic APK build by GitHub Actions for commit \`${{ github.sha }}\`.
          
          ### Download APKs:
          - **JaapCounter-release.apk** (Production release build)
          - **JaapCounter-debug.apk** (Debug testing build)
          
          - **Run Number:** #${{ github.run_number }}
          - **Commit SHA:** \`${{ github.sha }}\`"
          
          gh release create "$TAG_NAME" $TMP_DIR/*.apk \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK release status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.release_publishing.outcome }}" == "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            {
              echo "### 🚀 APK Published Successfully!"
              echo ""
              echo "- **Build Number:** #${{ github.run_number }}"
              echo "- **Artifacts Uploaded:** JaapCounter-release.apk, JaapCounter-debug.apk"
              echo ""
              echo "You can download the compiled APKs directly from the **Releases** tab on your GitHub repository."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "=== Release publishing completed or available via Actions artifacts ==="
            {
              echo "### 📦 APK Built Successfully"
              echo ""
              echo "- **Status:** The Android APK compiled without errors!"
              echo "- **Actions Artifacts:** Download \`jaap-counter-apks\` directly from the GitHub Actions run summary."
            } >> $GITHUB_STEP_SUMMARY
          fi

